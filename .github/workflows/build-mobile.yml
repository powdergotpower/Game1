name: Build Mobile Apps

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'yarn'
        cache-dependency-path: frontend/yarn.lock
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install dependencies
      run: |
        cd frontend
        yarn install --frozen-lockfile
        
    - name: Build web app
      run: |
        cd frontend
        yarn build
        
    - name: Add Android platform
      run: |
        cd frontend
        npx cap add android
        
    - name: Sync Capacitor
      run: |
        cd frontend
        npx cap sync android
        
    - name: Build Android APK
      run: |
        cd frontend
        npx cap build android --prod
        
    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'yarn'
        cache-dependency-path: frontend/yarn.lock
        
    - name: Install dependencies
      run: |
        cd frontend
        yarn install --frozen-lockfile
        
    - name: Build web app
      run: |
        cd frontend
        yarn build
        
    - name: Add iOS platform
      run: |
        cd frontend
        npx cap add ios
        
    - name: Sync Capacitor
      run: |
        cd frontend
        npx cap sync ios
        
    - name: Build iOS
      run: |
        cd frontend
        npx cap build ios
        
    - name: Upload iOS build
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: frontend/ios/
